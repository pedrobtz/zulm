on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      full:
        description: The full profile, as before submission
        type: boolean
        default: false

name: native-checks

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# The native checks of pedrobtz/r-actions for zulm's C and C++, vendored ggml
# included (CRAN runs its sanitizer, valgrind and LTO flavours on all of it).
#
# Quick on every pull request and push, each job within about five minutes:
# gctorture runs the smoke set (ZULM_TESTS=smoke, the tests that make every
# kind of call into the C code, tools/smoke-tests.R) and tortures each kind
# of call once; rchk and the analyzers run as always. The sanitizers,
# valgrind, LTO and cran-special take longer whatever the tests, and run
# only in the full run before submission (CLAUDE.md): dispatched with
# full: true, or a pull request labelled full-ci.
jobs:
  # r-actions instruments R's dependencies for six minutes before the
  # package builds, so the sanitizers cannot be quick: full runs only.
  sanitizers:
    if: ${{ (inputs.full || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    uses: pedrobtz/r-actions/.github/workflows/sanitizers.yml@v1
    with:
      asan: true
      profile: full

  valgrind:
    uses: pedrobtz/r-actions/.github/workflows/valgrind.yml@v1
    with:
      # The full suite under valgrind takes about two and a half hours
      # since state tensors, the decode and flash-attention tests (Stages 9
      # and 10); nothing is skipped, the job only gets the time it needs.
      timeout-minutes: 300
      # glibc's thread-local storage of live threads (tools/valgrind.supp)
      suppressions: tools/valgrind.supp
      profile: ${{ (inputs.full || contains(github.event.pull_request.labels.*.name, 'full-ci')) && 'full' || 'quick' }}

  # LTO is a second build of every variant (about seven minutes): full runs
  # only.
  lto:
    if: ${{ (inputs.full || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    uses: pedrobtz/r-actions/.github/workflows/lto.yml@v1

  # R's collector is forced only inside zulm's .Call()s, where a missing
  # PROTECT can bite (ZULM_GCTORTURE, R/load.R), not over testthat and R
  # loops; r-actions' own gctorture2() is off (step 0). Quick: the smoke
  # set, each kind of call tortured once at every allocation. Full: the
  # whole suite, each kind of call three times.
  gctorture:
    uses: pedrobtz/r-actions/.github/workflows/gctorture.yml@v1
    with:
      step: 0
      quick-step: 0
      env: |
        ZULM_TESTS=${{ (inputs.full || contains(github.event.pull_request.labels.*.name, 'full-ci')) && 'all' || 'smoke' }}
        ZULM_GCTORTURE=${{ (inputs.full || contains(github.event.pull_request.labels.*.name, 'full-ci')) && '1,3' || '1,1' }}

  # zurand, which zulm links to, is not on CRAN yet; rchk's image installs
  # only from CRAN.
  rchk:
    uses: pedrobtz/r-actions/.github/workflows/rchk.yml@v1
    with:
      github-packages: |
        pedrobtz/zurand

  # Upstream ggml's findings are upstream's: they show in the summary under
  # their own heading and do not count.
  analyzers:
    uses: pedrobtz/r-actions/.github/workflows/analyzers.yml@v1
    with:
      exclude: |
        src/ggml
        src/zlm_v

  cran-special:
    uses: pedrobtz/r-actions/.github/workflows/cran-special.yml@v1
    with:
      profile: ${{ (inputs.full || contains(github.event.pull_request.labels.*.name, 'full-ci')) && 'full' || 'quick' }}
