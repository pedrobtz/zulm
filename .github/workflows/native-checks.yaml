on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

name: native-checks

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# The native checks of pedrobtz/r-actions for zulm's C and C++, vendored ggml
# included (CRAN runs its sanitizer, valgrind and LTO flavours on all of it).
# `profile` goes to the three workflows it changes: quick skips the asan
# containers, valgrind and cran-special. gctorture has its own switch,
# below. lto, rchk and analyzers take minutes either way and run on every
# push.
jobs:
  sanitizers:
    uses: pedrobtz/r-actions/.github/workflows/sanitizers.yml@v1
    with:
      asan: true
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}

  valgrind:
    uses: pedrobtz/r-actions/.github/workflows/valgrind.yml@v1
    with:
      # The full suite under valgrind takes about two and a half hours
      # since state tensors, the decode and flash-attention tests (Stages 9
      # and 10); nothing is skipped, the job only gets the time it needs.
      timeout-minutes: 300
      # glibc's thread-local storage of live threads (tools/valgrind.supp)
      suppressions: tools/valgrind.supp
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}

  lto:
    uses: pedrobtz/r-actions/.github/workflows/lto.yml@v1

  # R's collector is forced only inside zulm's .Call()s, where a missing
  # PROTECT can bite (ZULM_GCTORTURE, R/load.R), not over testthat and R
  # loops. Every pull request runs the targeted pass: every allocation, the
  # first three calls of each routine and argument types, about ten
  # minutes. The long pass, every call at step 20, runs after a merge on
  # main, and on a pull request labelled gctorture-full, a label given
  # when the pull request changes how the glue handles R objects; what the
  # long pass finds on main is fixed there. r-actions' own gctorture2() is
  # off (step 0) so that it does not torture everything else.
  gctorture:
    uses: pedrobtz/r-actions/.github/workflows/gctorture.yml@v1
    with:
      step: 0
      quick-step: 0
      env: |
        ZULM_GCTORTURE=${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'gctorture-full') && '1,3' || '20,0' }}

  # zurand, which zulm links to, is not on CRAN yet; rchk's image installs
  # only from CRAN.
  rchk:
    uses: pedrobtz/r-actions/.github/workflows/rchk.yml@v1
    with:
      github-packages: |
        pedrobtz/zurand

  # Upstream ggml's findings are upstream's: they show in the summary under
  # their own heading and do not count.
  analyzers:
    uses: pedrobtz/r-actions/.github/workflows/analyzers.yml@v1
    with:
      exclude: |
        src/ggml
        src/zlm_v

  cran-special:
    uses: pedrobtz/r-actions/.github/workflows/cran-special.yml@v1
    with:
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}
