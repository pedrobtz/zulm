on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

name: native-checks

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# The native checks of pedrobtz/r-actions for zulm's C and C++, vendored ggml
# included (CRAN runs its sanitizer, valgrind and LTO flavours on all of it).
# `profile` goes to the four workflows it changes: quick skips the asan
# containers, valgrind and cran-special, and runs gctorture at step 500
# instead of 20. lto, rchk and analyzers take minutes either way and run on
# every push.
jobs:
  sanitizers:
    uses: pedrobtz/r-actions/.github/workflows/sanitizers.yml@v1
    with:
      asan: true
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}

  valgrind:
    uses: pedrobtz/r-actions/.github/workflows/valgrind.yml@v1
    with:
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}

  lto:
    uses: pedrobtz/r-actions/.github/workflows/lto.yml@v1

  gctorture:
    uses: pedrobtz/r-actions/.github/workflows/gctorture.yml@v1
    with:
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}

  # zurand, which zulm links to, is not on CRAN yet; rchk's image installs
  # only from CRAN.
  rchk:
    uses: pedrobtz/r-actions/.github/workflows/rchk.yml@v1
    with:
      github-packages: |
        pedrobtz/zurand

  # Upstream ggml's findings are upstream's: they show in the summary under
  # their own heading and do not count.
  analyzers:
    uses: pedrobtz/r-actions/.github/workflows/analyzers.yml@v1
    with:
      exclude: |
        src/ggml
        src/zlm_v

  cran-special:
    uses: pedrobtz/r-actions/.github/workflows/cran-special.yml@v1
    with:
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}
