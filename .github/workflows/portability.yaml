# The native-build hook of design §13.4: with ZULM_CFLAGS and ZULM_CXXFLAGS
# set, one variant named "native" is built from them, they reach every C and
# C++ compile, and the suite passes. Not on Windows, whose Makevars.win has
# no hook.
on:
  push:
    branches: [main, master]
    paths-ignore: ['**.md', '.agents/**', '_pkgdown.yml', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', '.agents/**', '_pkgdown.yml', 'docs/**']

name: portability

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            flags: -march=native
          - os: macos-latest
            flags: -mcpu=native
          - os: macos-15-intel
            flags: -march=native
    runs-on: ${{ matrix.os }}
    name: native build via ZULM_CFLAGS (${{ matrix.os }})
    env:
      MAKEFLAGS: -j4
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::withr
      - name: install with the hooks set
        shell: bash
        env:
          ZULM_CFLAGS: ${{ matrix.flags }}
          ZULM_CXXFLAGS: ${{ matrix.flags }}
        run: |
          R CMD INSTALL --preclean . 2>&1 | tee install.log
          c=$(grep -E '^(gcc|clang|cc)( |-)' install.log | grep -c -- "$ZULM_CFLAGS" || true)
          cxx=$(grep -E '^(g\+\+|clang\+\+|c\+\+)( |-)' install.log | grep -c -- "$ZULM_CXXFLAGS" || true)
          echo "C compiles carrying the hook: $c; C++ compiles: $cxx"
          [ "$c" -ge 5 ] && [ "$cxx" -ge 10 ] || { echo "::error::the hooks did not reach the compiler"; exit 1; }
          if grep -E '^(gcc|clang|cc|g\+\+|clang\+\+|c\+\+)( |-).* -c ' install.log | grep -v -- "$ZULM_CFLAGS"; then
            echo "::error::a compile line lacks the hook"; exit 1
          fi
      - name: the native variant is loaded and correct
        shell: Rscript {0}
        run: |
          info <- zulm::zulm_info()
          str(info[c("variant", "variants_installed", "native_cflags", "native_cxxflags")])
          stopifnot(identical(info$variant, "native"), identical(info$variants_installed, "native"))
          stopifnot(nzchar(info$native_cflags), nzchar(info$native_cxxflags))
          testthat::test_local(".", load_package = "installed", stop_on_failure = TRUE)
