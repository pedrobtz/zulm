# Coverage-guided fuzzing of zulm (design §11, §15 criterion 4), through
# r-actions' libFuzzer harness with ASan and UBSan. tools/fuzz/fuzz.c embeds
# R and drives zulm through its R functions, so every target is built with
# the glue and the baseline variant's ggml instrumented:
#
#   graph  graph construction from random operation sequences and shapes,
#          forward and training
#   files  arbitrary bytes as a GGUF file and as a safetensors header
#   arrow  the Arrow type map, on streams built from the input
#
# A finding is a crash, a sanitizer report, a ggml assertion or an R error
# without a zulm class. tools/run-fuzz runs the same targets locally.
#
# Quick on pull requests and pushes: a minute a target, from the cached
# corpus. Full before submission (CLAUDE.md): dispatched with full: true, or
# a pull request labelled full-ci, an hour a target.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      full:
        description: An hour a target, as before submission
        type: boolean
        default: false

name: fuzz

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target: [{ name: graph, n: 1 }, { name: files, n: 2 }, { name: arrow, n: 3 }]
    name: fuzz (${{ matrix.target.name }})
    uses: pedrobtz/r-actions/.github/workflows/fuzz.yml@v1
    with:
      harness: tools/fuzz/fuzz.c
      sources: >-
        src/zlm_*.c src/zlm_*.cpp src/zlm_v/common/*.c src/zlm_v/common/*.cpp
        src/zlm_v/baseline/ggml-*.c src/zlm_v/baseline/ggml-*.cpp
      embed-r: true
      # zurand.h, for the glue; zurand is not on CRAN yet
      github-packages: pedrobtz/zurand
      # tools/fuzz/cflags, with zurand's checkout; UBSan must stop the run.
      # The job links with clang, not clang++, which leaves out the C++
      # sanitizer runtime UBSan's vptr check calls into: it is asked for.
      cflags: >-
        -g -O1 -fno-omit-frame-pointer -fno-sanitize-recover=undefined
        -fsanitize-link-c++-runtime
        -DZLM_FUZZ_TARGET=${{ matrix.target.n }} -DZLM_VARIANT=baseline
        -Isrc -Isrc/ggml/include -Isrc/ggml/src -Isrc/ggml/src/ggml-cpu
        -I.github-packages/zurand/inst/include
        -DGGML_USE_CPU_REPACK -DGGML_USE_LLAMAFILE -DGGML_SCHED_MAX_COPIES=4
        -DGGML_SCHED_MAX_SPLIT_INPUTS=4 -pthread
      seed-corpus: tools/fuzz/seeds/${{ matrix.target.name }}
      libfuzzer-args: -rss_limit_mb=4096 -max_len=4096
      max-total-time: ${{ (inputs.full || contains(github.event.pull_request.labels.*.name, 'full-ci')) && 3600 || 60 }}
      timeout-minutes: 90
