# Stage 1 measurements (design §12, §13.1): the variant scheme against
# flag-built references, the unrolling pragma against -funroll-loops,
# llamafile kernels (on in the shipped build) against the plain ones,
# install time and size. The `targets` job runs tools/run-benchmarks, the
# §12 targets, on an AVX2 runner: the shipped build, then the native hook.
# Informational: the numbers go to the job summary and into the design by
# hand.
#
# Measurements, not checks: dispatched, as in the full run before
# submission, or on a pull request labelled full-ci.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

name: measure

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  measure:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'full-ci'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
          - os: ubuntu-latest
            compiler: clang
          - os: macos-15-intel
            compiler: clang
          - os: macos-latest
            compiler: clang
          - os: windows-latest
            compiler: gcc
    runs-on: ${{ matrix.os }}
    name: measure (${{ matrix.os }}, ${{ matrix.compiler }})
    env:
      MAKEFLAGS: -j4
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
      - name: A library of its own for zulm
        # builds of zulm stay out of the cached dependency library that
        # other jobs restore: a -march=native build there crashed covr's
        # merge with an illegal instruction on another runner's CPU
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/zulm-lib"
          echo "R_LIBS=$RUNNER_TEMP/zulm-lib" >> "$GITHUB_ENV"
      - name: clang as the compiler
        if: matrix.os == 'ubuntu-latest' && matrix.compiler == 'clang'
        shell: bash
        run: |
          mkdir -p ~/.R
          printf 'CC=clang\nCXX=clang++\nCXX17=clang++\n' >> ~/.R/Makevars
      - name: CPU
        shell: bash
        run: |
          (lscpu 2>/dev/null || sysctl -a 2>/dev/null | grep machdep.cpu || powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name" || true) | head -30
      - name: variants (the shipped build)
        shell: bash
        run: |
          start=$(date +%s)
          R CMD INSTALL --preclean . > install.log 2>&1 || { tail -50 install.log; exit 1; }
          end=$(date +%s)
          libs=$(Rscript -e 'cat(system.file("libs", package = "zulm"))')
          echo "install wall time: $((end - start)) s with MAKEFLAGS=$MAKEFLAGS" | tee -a "$GITHUB_STEP_SUMMARY"
          du -k "$libs"/* | tee -a "$GITHUB_STEP_SUMMARY"
          Rscript tools/bench-variants.R variants
      - name: references built with -m flags (x86-64)
        if: matrix.os != 'macos-latest' && matrix.os != 'windows-latest'
        shell: bash
        run: |
          export ZULM_CFLAGS="-msse3 -mssse3 -msse4.1 -msse4.2 -mpopcnt -mavx -mavx2 -mfma -mf16c -mbmi -mbmi2"
          export ZULM_CXXFLAGS="$ZULM_CFLAGS"
          R CMD INSTALL --preclean . > install-mavx2.log 2>&1 || { tail -50 install-mavx2.log; exit 1; }
          Rscript tools/bench-variants.R mavx2
          if [ "${{ matrix.compiler }}" = gcc ]; then
            export ZULM_CFLAGS="$ZULM_CFLAGS -funroll-loops"
            export ZULM_CXXFLAGS="$ZULM_CFLAGS"
            R CMD INSTALL --preclean . > install-unroll.log 2>&1 || { tail -50 install-unroll.log; exit 1; }
            Rscript tools/bench-variants.R mavx2-funroll-loops
          fi
      - name: plain kernels (llamafile off)
        shell: bash
        run: |
          mkdir -p ~/.R
          # R on Windows reads ~/.R/Makevars.ucrt first, then
          # Makevars.win64 and Makevars.win; the others ~/.R/Makevars.
          for f in Makevars Makevars.ucrt Makevars.win64 Makevars.win; do
            echo 'CPPFLAGS += -UGGML_USE_LLAMAFILE' >> ~/.R/$f
          done
          R CMD INSTALL --preclean . > install-plain.log 2>&1 || { tail -50 install-plain.log; exit 1; }
          Rscript tools/bench-variants.R plain

  targets:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-latest
    name: targets (ubuntu-latest, gcc)
    env:
      MAKEFLAGS: -j4
      # torch's reference timings need LibTorch
      TORCH_INSTALL: 1
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # the TimesFM block's torch reference, and Toto 2.0 4M through
          # zukzeit's zulm-runtime branch (which brings torch)
          extra-packages: any::torch, any::hfhub, any::jsonlite, github::pedrobtz/zukzeit@zulm-runtime
      - name: A library of its own for zulm
        # builds of zulm stay out of the cached dependency library that
        # other jobs restore: a -march=native build there crashed covr's
        # merge with an illegal instruction on another runner's CPU
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/zulm-lib"
          echo "R_LIBS=$RUNNER_TEMP/zulm-lib" >> "$GITHUB_ENV"
      - name: CPU
        run: lscpu | head -30
      - name: LibTorch
        run: Rscript -e 'if (!torch::torch_is_installed()) torch::install_torch()'
      - name: targets (the shipped build)
        run: |
          # this tree's zulm, not the one zukzeit's Remotes installed, which
          # leaves the cached library too
          Rscript -e 'if (nzchar(system.file(package = "zulm"))) remove.packages("zulm", lib = dirname(system.file(package = "zulm")))'
          R CMD INSTALL --preclean . > install.log 2>&1 || { tail -50 install.log; exit 1; }
          Rscript tools/run-benchmarks shipped
      - name: targets (the native hook)
        run: |
          export ZULM_CFLAGS="-march=native -O3" ZULM_CXXFLAGS="-march=native -O3"
          R CMD INSTALL --preclean . > install-native.log 2>&1 || { tail -50 install-native.log; exit 1; }
          Rscript tools/run-benchmarks native
