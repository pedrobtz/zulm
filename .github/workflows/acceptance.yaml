# Design §15 criterion 2: the §1.1 model trains on synthetic data to the
# acceptance target, with bit-identical results at one and two threads,
# and its flow head samples finite values (tests/testthat/test-acceptance.R);
# the timing bounds that ordinary builds can hold (design §12); training
# from DuckDB and Parquet through Arrow (§15 criterion 12); and the Arrow
# tests without nanoarrow (§11).
on:
  push:
    branches: [main, master]
    paths-ignore: ['**.md', '.agents/**', '_pkgdown.yml', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', '.agents/**', '_pkgdown.yml', 'docs/**']

name: acceptance

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MAKEFLAGS: -j4
      ZULM_ACCEPTANCE: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::withr, any::nanoarrow, any::DBI, any::duckdb
      - name: A library of its own for zulm
        # builds of zulm stay out of the cached dependency library that
        # other jobs restore: a -march=native build there crashed covr's
        # merge with an illegal instruction on another runner's CPU
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/zulm-lib"
          echo "R_LIBS=$RUNNER_TEMP/zulm-lib" >> "$GITHUB_ENV"
      - run: R CMD INSTALL .
      - name: the §1.1 model, 1 000 steps at one and two threads
        shell: Rscript {0}
        run: |
          testthat::test_file("tests/testthat/test-acceptance.R", package = "zulm",
                              load_package = "installed", stop_on_failure = TRUE)
      - name: graph construction per shape and the decode loop (design §12)
        shell: Rscript {0}
        run: |
          testthat::test_file("tests/testthat/test-decode.R", package = "zulm",
                              load_package = "installed", stop_on_failure = TRUE)
      - name: flash attention over a 10 240-position context (design §6.9)
        shell: Rscript {0}
        run: |
          testthat::test_file("tests/testthat/test-flash.R", package = "zulm",
                              load_package = "installed", stop_on_failure = TRUE)
      - name: the §1.1 model from a DuckDB table and a Parquet file (§15 criterion 12)
        run: Rscript tools/acceptance/arrow-duckdb.R

  without-nanoarrow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAKEFLAGS: -j4
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::withr
      - name: A library of its own for zulm
        # builds of zulm stay out of the cached dependency library that
        # other jobs restore: a -march=native build there crashed covr's
        # merge with an illegal instruction on another runner's CPU
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/zulm-lib"
          echo "R_LIBS=$RUNNER_TEMP/zulm-lib" >> "$GITHUB_ENV"
      - run: |
          Rscript -e 'if (requireNamespace("nanoarrow", quietly = TRUE)) remove.packages("nanoarrow", lib = dirname(system.file(package = "nanoarrow")))'
          R CMD INSTALL .
      - name: the Arrow tests skip, and the documented errors hold, without nanoarrow
        shell: Rscript {0}
        run: |
          stopifnot(!requireNamespace("nanoarrow", quietly = TRUE))
          testthat::test_file("tests/testthat/test-arrow.R", package = "zulm",
                              load_package = "installed", stop_on_failure = TRUE)
