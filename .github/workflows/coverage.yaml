# Coverage runs the whole suite on all variants (about 26 minutes), so not
# on pull requests: after each merge to main, where it also updates the
# badge, and when dispatched, as in the full run before submission.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

name: coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  coverage:
    uses: pedrobtz/r-actions/.github/workflows/coverage.yml@v1
    permissions:
      contents: write
    # The main ruleset requires pull requests, so the badge commit goes to
    # gh-pages, which takes bot pushes (pkgdown deploys there too).
    with:
      badge-branch: gh-pages
      badge-path: badges/coverage.svg
